<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d">
<title id='t'>Demo lab results: score per target</title>
<desc id='d'>Scores from the Docker demo lab with the baseline policy. http://hardened.lab:80/ 100 (A); https://hardened.lab:443/ 100 (A); http://spa.lab:80/ 90 (A); https://spa.lab:443/ 90 (A); http://mixed.lab:80/ 68 (D); http://weak.lab:80/ 0 (F); https://weak.lab:443/ 0 (F)</desc>
<style>
.bar{fill:#2a78d6}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#d9d8d4}
text{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){.bar{fill:#3987e5}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#3a3a37}}
</style>
<text class="h t1" x="0" y="20">Demo lab results: score per target</text>
<text class="t2" x="0" y="40">Docker lab, baseline policy, Nmap 7.95. Lab targets, not real sites.</text>
