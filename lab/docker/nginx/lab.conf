# Three virtual hosts on one nginx. Intentionally insecure test targets.

# hardened.lab: HTTP redirects to HTTPS; HTTPS sends a complete header set.
server {
    listen 80;
    server_name hardened.lab;
    server_tokens off;
    location = /healthz { return 200 "ok"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name hardened.lab;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    server_tokens off;
    root /srv/hardened;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Set-Cookie "__Host-session=lab; Path=/; Secure; HttpOnly; SameSite=Lax" always;
}

# weak.lab: every header present with a weak value, plus exposed files.
server {
    listen 80;
    listen 443 ssl;
    server_name weak.lab;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    server_tokens on;
    root /srv/weak;

    add_header Strict-Transport-Security "max-age=300";
    add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'";
    add_header X-Frame-Options "ALLOW-FROM https://partner.example";
    add_header X-XSS-Protection "1; mode=block";
    add_header Set-Cookie "PHPSESSID=lab; Path=/";
    # Reflects any Origin with credentials: the classic CORS misconfiguration.
    add_header Access-Control-Allow-Origin $http_origin;
    add_header Access-Control-Allow-Credentials "true";

    location /files/ { autoindex on; }
}

# spa.lab: a single page app that answers every path with index.html (soft-404).
# Served on HTTP and HTTPS without a redirect or HSTS.
server {
    listen 80;
    listen 443 ssl;
    server_name spa.lab;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    server_tokens off;
    root /srv/spa;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    location / { try_files $uri /index.html; }
}
